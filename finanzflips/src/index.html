<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1310" />
    <meta
      name="description"
      content="Dein persönlicher Finanzüberblick: Konten, Verträge, Einnahmen und Kredite lokal auf deinem Mac."
    />
    <title>FinanzFlips · Dein Finanzblick</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=3" />
    <script type="module" src="./app.js?v=3"></script>
  </head>
  <body>
    <a href="#main-content" class="sr-only">Zum Inhalt springen</a>
    <div id="startup" role="status">
      <div class="startup-brand">
        <span class="brand-mark">F</span> FinanzFlips
      </div>
      <div class="spinner" aria-hidden="true"></div>
      <p class="muted">Deine lokalen Finanzdaten werden geladen.</p>
    </div>
    <div id="app" hidden></div>
    <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
    <div
      id="toasts"
      class="toast-region"
      aria-live="polite"
      aria-atomic="false"
    ></div>
    <input
      id="import-file"
      type="file"
      accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      hidden
    />
    <input
      id="restore-file"
      type="file"
      accept=".json,application/json"
      hidden
    />
    <noscript
      ><p>
        Bitte JavaScript aktivieren, um FinanzFlips zu verwenden.
      </p></noscript
    >
  </body>
</html>
